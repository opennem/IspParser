[project]
name = "ispparser"
version = "0.1.0"

dependencies = [
    "pandas",
    "numpy",
    "pytz",
    "python-calamine",
    "openpyxl",
]

[project.optional-dependencies]
test = ["pytest"]
# For scripts/generate_emissions_screenshot.py (then: playwright install chromium)
screenshots = ["playwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
