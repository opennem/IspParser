<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISP Workbook Parser — Chart Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2/dist/css/tom-select.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2/dist/js/tom-select.complete.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <a href="https://openelectricity.org.au" class="header-logo" aria-label="Open Electricity">
          <img src="https://openelectricity.org.au/img/logo.svg" alt="Open Electricity" height="32">
        </a>
        <h1>ISP Workbook Parser</h1>
      </div>
      <a href="https://github.com/opennem/IspParser" class="header-github" aria-label="View on GitHub">
        <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
  </header>

  <form class="controls" role="search" aria-label="Chart filters" onsubmit="return false">
    <div class="controls-row">
      <fieldset class="release-bar" id="release-bar">
        <legend class="release-bar-label">Report</legend>
      </fieldset>
      <fieldset class="control-group control-group-scenario">
        <legend>Scenario</legend>
        <select id="sel-scenario" aria-label="Scenario"></select>
      </fieldset>
      <fieldset class="control-group">
        <legend>Region</legend>
        <select id="sel-region" aria-label="Region"></select>
      </fieldset>
    </div>
    <div class="controls-row">
      <fieldset class="control-group control-group-cdp">
        <legend>Pathway</legend>
        <select id="sel-pathway" aria-label="Development pathway"></select>
      </fieldset>
    </div>
    <div id="fuel-tech-legend" class="fuel-tech-legend"></div>
  </form>

  <main class="main">
    <div class="chart-grid" id="chart-grid">
      <div class="chart-card" id="card-energy">
        <h3>Generation</h3>
        <canvas id="chart-energy"></canvas>
        <div class="loading-overlay hidden" id="load-energy"><div class="spinner"></div></div>
      </div>
      <div class="chart-card" id="card-capacity">
        <h3>Capacity</h3>
        <canvas id="chart-capacity"></canvas>
        <div class="loading-overlay hidden" id="load-capacity"><div class="spinner"></div></div>
      </div>
      <div class="chart-card" id="card-emissions">
        <h3>Emissions</h3>
        <canvas id="chart-emissions"></canvas>
        <div class="loading-overlay hidden" id="load-emissions"><div class="spinner"></div></div>
      </div>
      <div class="chart-card" id="card-cost">
        <h3>Cost (NEM-wide)</h3>
        <canvas id="chart-cost"></canvas>
        <div class="loading-overlay hidden" id="load-cost"><div class="spinner"></div></div>
      </div>
    </div>

    <section class="downloads" id="downloads">
      <h3>Download Output Files</h3>
      <nav class="download-links" id="download-links" aria-label="Download files"></nav>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
